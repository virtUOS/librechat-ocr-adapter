[project]
name = "librechat-ocr-adapter"
version = "0.1.0"
description = "Mistral-OCR-compatible document OCR service for LibreChat on top of vLLM and LightOnOCR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdfium2>=5,<6",
    "pillow>=11",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
]

[project.urls]
Repository = "https://github.com/virtUOS/librechat-ocr-adapter"
Changelog = "https://github.com/virtUOS/librechat-ocr-adapter/blob/main/CHANGELOG.md"

[project.scripts]
librechat-ocr = "ocr_adapter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "reportlab>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["ocr_adapter"]
known-local-folder = ["fixtures", "fake_vllm"]
